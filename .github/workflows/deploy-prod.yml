name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production environment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 在 GitHub runner 上打包，绕过服务器访问 GitHub 网络问题
      - name: Package and upload code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: /tmp/deploy_src_prod/
          rm: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            PROD_DIR=/home/ubuntu/contract-review-prod
            SRC=/tmp/deploy_src_prod

            echo "=== [1/5] Syncing code ==="
            rsync -a --delete \
              --exclude='.env' \
              --exclude='.env.prod' \
              --exclude='node_modules' \
              $SRC/ $PROD_DIR/
            rm -rf $SRC

            echo "=== [2/5] Rebuild frontend (no-cache) ==="
            docker compose -f $PROD_DIR/docker-compose.prod.yml --env-file $PROD_DIR/.env.prod -p prod build --no-cache frontend

            echo "=== [3/5] Restart backend & frontend ==="
            docker compose -f $PROD_DIR/docker-compose.prod.yml --env-file $PROD_DIR/.env.prod -p prod up -d backend frontend

            echo "=== [4/5] Waiting for backend ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8001/health > /dev/null 2>&1; then
                echo "backend ready"
                break
              fi
              sleep 2
            done

            echo "=== [5/5] DB migrations ==="
            docker compose -f $PROD_DIR/docker-compose.prod.yml --env-file $PROD_DIR/.env.prod -p prod exec -T backend alembic upgrade head

            echo "=== Verifying ==="
            curl -fsS http://127.0.0.1:8001/health || (echo "health check failed" && exit 1)
            echo "=== Prod deployment done ==="
