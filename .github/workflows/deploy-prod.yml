name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只能跑一个 prod 部署，避免互相覆盖
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production environment
    runs-on: ubuntu-latest
    # 要求人工审批后才执行（在 GitHub repo settings → Environments → production 配置 protection rules）
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 由 GitHub Actions runner 打包代码，通过 scp 推到服务器
      # 完全绕过服务器访问 GitHub 的网络问题
      - name: Package code
        run: |
          tar -czf deploy.tar.gz --exclude='.git' --exclude='node_modules' .
          echo "Package size: $(du -sh deploy.tar.gz)"

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: deploy.tar.gz
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            PROD_DIR=/home/ubuntu/contract-review-prod

            echo "=== [1/5] Extracting code ==="
            cd $PROD_DIR
            tar -xzf /tmp/deploy.tar.gz --overwrite
            rm -f /tmp/deploy.tar.gz

            echo "=== [2/5] Rebuild prod stack (no-cache frontend) ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod build --no-cache frontend
            docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod up -d backend frontend

            echo "=== [3/5] Waiting for backend to be ready ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8001/health > /dev/null 2>&1; then
                echo "backend ready after ${i}x2s"
                break
              fi
              sleep 2
            done

            echo "=== [4/5] Running DB migrations ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod exec -T backend alembic upgrade head

            echo "=== [5/5] Verifying ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod ps
            curl -fsS http://127.0.0.1:8001/health || (echo "prod backend health check failed" && exit 1)

            echo "=== Prod deployment done ==="
