name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只能跑一个 prod 部署，避免互相覆盖
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production environment
    runs-on: ubuntu-latest
    # 要求人工审批后才执行（在 GitHub repo settings → Environments → production 配置 protection rules）
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            PROD_DIR=/home/ubuntu/contract-review-prod

            if [ ! -d "$PROD_DIR/.git" ]; then
              echo "ERROR: $PROD_DIR is not a git repo. Please run initial setup script first." >&2
              exit 1
            fi

            cd "$PROD_DIR"

            echo "=== Pulling latest code from main ==="
            # 腾讯云访问 GitHub 不稳定，最多重试 3 次
            for i in 1 2 3; do
              git fetch origin main && break
              echo "git fetch attempt $i failed, retrying in 10s..."
              sleep 10
            done
            git checkout main 2>/dev/null || git checkout -B main origin/main
            git reset --hard origin/main

            echo "=== Rebuilding prod stack ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod build --no-cache frontend
            docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod up -d backend frontend

            echo "=== Waiting for backend to be ready ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8001/health > /dev/null 2>&1; then
                echo "backend ready"
                break
              fi
              sleep 2
            done

            echo "=== Running DB migrations ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod exec -T backend alembic upgrade head

            echo "=== Verifying ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod ps
            curl -fsS http://127.0.0.1:8001/health || (echo "prod backend health check failed" && exit 1)

            echo "=== Prod deployment done ==="
