name: Deploy to Test

on:
  push:
    branches: [develop]
  workflow_dispatch:  # 允许手动触发

# 同一时刻只能跑一个 test 部署
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to test environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 由 GitHub Actions runner 打包代码，通过 scp 推到服务器
      # 完全绕过服务器访问 GitHub 的网络问题
      - name: Package code
        run: |
          tar -czf deploy.tar.gz --exclude='.git' --exclude='node_modules' .
          echo "Package size: $(du -sh deploy.tar.gz)"

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: deploy.tar.gz
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR=/home/ubuntu/contract-review

            echo "=== [1/5] Extracting code ==="
            cd $DEPLOY_DIR
            tar -xzf /tmp/deploy.tar.gz --overwrite
            rm -f /tmp/deploy.tar.gz

            echo "=== [2/5] Rebuild frontend (no-cache to avoid stale image) ==="
            docker compose -f docker-compose.yml build --no-cache frontend

            echo "=== [3/5] Restart backend & frontend ==="
            docker compose -f docker-compose.yml up -d backend frontend

            echo "=== [4/5] Waiting for backend to be ready ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "backend ready after ${i}x2s"
                break
              fi
              sleep 2
            done

            echo "=== [5/5] Running DB migrations ==="
            docker compose -f docker-compose.yml exec -T backend alembic upgrade head

            echo "=== Verifying ==="
            docker compose -f docker-compose.yml ps
            curl -fsS http://127.0.0.1:8000/health || (echo "test backend health check failed" && exit 1)

            echo "=== Test deployment done ==="
