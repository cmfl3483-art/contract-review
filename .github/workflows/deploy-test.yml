name: Deploy to Test

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to test environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 在 GitHub runner 上打包，绕过服务器访问 GitHub 网络问题
      - name: Package and upload code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: /tmp/deploy_src/
          rm: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR=/home/ubuntu/contract-review
            SRC=/tmp/deploy_src

            echo "=== [1/5] Syncing code ==="
            # 用 rsync 同步，保留服务器上的 .env（不在 git 里）
            rsync -a --delete \
              --exclude='.env' \
              --exclude='.env.prod' \
              --exclude='node_modules' \
              $SRC/ $DEPLOY_DIR/
            rm -rf $SRC

            echo "=== [2/5] Graceful stop celery_worker before rebuild ==="
            # 先优雅停止 worker，避免正在执行的任务被强制中断产生孤儿记录
            # --signal SIGTERM 让 worker 完成当前任务后退出（最多等 30s）
            docker compose -f $DEPLOY_DIR/docker-compose.yml stop celery_worker || true

            echo "=== [3/5] Rebuild backend & frontend & celery_worker (no-cache) ==="
            docker compose -f $DEPLOY_DIR/docker-compose.yml build --no-cache backend frontend celery_worker

            echo "=== [4/5] Restart backend & frontend & celery_worker ==="
            docker compose -f $DEPLOY_DIR/docker-compose.yml up -d backend frontend celery_worker

            echo "=== [5/6] Waiting for backend ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "backend ready"
                break
              fi
              sleep 2
            done

            echo "=== [6/6] DB migrations ==="
            docker compose -f $DEPLOY_DIR/docker-compose.yml exec -T backend alembic upgrade head

            echo "=== Verifying ==="
            curl -fsS http://127.0.0.1:8000/health || (echo "health check failed" && exit 1)
            echo "=== Test deployment done ==="
