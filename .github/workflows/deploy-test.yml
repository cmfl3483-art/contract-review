name: Deploy to Test

on:
  push:
    branches: [develop]
  workflow_dispatch:  # 允许手动触发

# 同一时刻只能跑一个 test 部署
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to test environment
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/contract-review

            echo "=== Pulling latest code from develop ==="
            # 腾讯云访问 GitHub 不稳定，最多重试 3 次
            for i in 1 2 3; do
              git fetch origin develop && break
              echo "git fetch attempt $i failed, retrying in 10s..."
              sleep 10
            done
            git checkout develop 2>/dev/null || git checkout -B develop origin/develop
            git reset --hard origin/develop

            echo "=== Rebuilding test stack ==="
            docker compose -f docker-compose.yml build --no-cache frontend
            docker compose -f docker-compose.yml up -d backend frontend

            echo "=== Waiting for backend to be ready ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "backend ready"
                break
              fi
              sleep 2
            done

            echo "=== Running DB migrations ==="
            docker compose -f docker-compose.yml exec -T backend alembic upgrade head

            echo "=== Verifying ==="
            docker compose -f docker-compose.yml ps
            curl -fsS http://127.0.0.1:8000/health || (echo "test backend health check failed" && exit 1)

            echo "=== Test deployment done ==="
