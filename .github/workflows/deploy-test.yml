name: Deploy to Test

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to test environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 在 GitHub runner 上打包，绕过服务器访问 GitHub 网络问题
      - name: Package and upload code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: /tmp/deploy_src/
          rm: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR=/home/ubuntu/contract-review
            SRC=/tmp/deploy_src

            echo "=== [1/5] Syncing code ==="
            # 用 rsync 同步，保留服务器上的 .env（不在 git 里）
            rsync -a --delete \
              --exclude='.env' \
              --exclude='.env.prod' \
              --exclude='node_modules' \
              $SRC/ $DEPLOY_DIR/
            rm -rf $SRC

            echo "=== [2/5] Rebuild frontend (no-cache) ==="
            docker compose -f $DEPLOY_DIR/docker-compose.yml build --no-cache frontend

            echo "=== [3/5] Install backend dependencies & restart ==="
            # 先启动 backend（bind mount 已同步新代码）
            docker compose -f $DEPLOY_DIR/docker-compose.yml up -d backend frontend
            # 安装 requirements.txt 中新增的依赖（openpyxl 等），然后重启使其生效
            docker compose -f $DEPLOY_DIR/docker-compose.yml exec -T backend pip install -r /app/requirements.txt -q
            docker compose -f $DEPLOY_DIR/docker-compose.yml restart backend

            echo "=== [4/5] Waiting for backend ==="
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "backend ready"
                break
              fi
              sleep 2
            done

            echo "=== [5/5] DB migrations ==="
            docker compose -f $DEPLOY_DIR/docker-compose.yml exec -T backend alembic upgrade head

            echo "=== Verifying ==="
            curl -fsS http://127.0.0.1:8000/health || (echo "health check failed" && exit 1)
            echo "=== Test deployment done ==="
