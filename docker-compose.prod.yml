# 生产环境 Docker Compose 配置
#
# 架构：方案 B（共享基础设施）
#   - postgres / redis / minio 复用 test 环境的容器（external network）
#   - 通过不同的 DB 名 / Redis db / bucket 隔离 test 与 prod 数据
#
# 启动命令：
#   docker compose -f docker-compose.prod.yml --env-file .env.prod -p prod up -d --build
#
# 端口分配：
#   prod backend  → 8001  (test 用 8000)
#   prod frontend → 8090  (test 用 8080)
#
# 容器命名前缀：通过 -p prod，自动变成 prod_backend / prod_frontend / prod_celery_worker
#
# 数据隔离：
#   - PostgreSQL 数据库：contract_review_prod
#   - Redis db 编号：3 (主) / 4 (celery broker) / 5 (celery result)
#   - MinIO bucket：contract-attachments-prod
#
# ⚠️ 共享基础设施风险：test 把 postgres 跑挂会影响 prod。不要在 test 跑大压测。

services:
  # 后端服务（prod）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod_backend
    environment:
      # 数据库 - 注意 DB 名是 contract_review_prod（区别于 test 的 contract_review）
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/contract_review_prod
      # Redis - 使用 db 3（区别于 test 的 db 0）
      REDIS_URL: redis://redis:6379/3
      # MinIO - 使用独立 bucket
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: contract-attachments-prod
      MINIO_SECURE: "false"
      # JWT - prod 必须用强密钥（来自 .env.prod）
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # 钉钉 - prod 用独立的钉钉应用
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET}
      DINGTALK_REDIRECT_URI: https://chenmin0922.online/api/auth/dingtalk/callback
      # CORS - 只允许生产域名
      CORS_ORIGINS: '["https://chenmin0922.online"]'
      # AI - 生产环境用与 test 相同的 AI（同一组 API Key）
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_BASE: ${AI_API_BASE:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      # Celery - 使用 db 4 / 5
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # bind mount：保证服务器上 git pull 后改动立即可见（重启容器即生效）
      - ./backend:/app
      - prod_backend_logs:/app/logs
    networks:
      - shared
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod_celery_worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/contract_review_prod
      REDIS_URL: redis://redis:6379/3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: contract-attachments-prod
      MINIO_SECURE: "false"
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_BASE: ${AI_API_BASE:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      CELERY_BROKER_URL: redis://redis:6379/4
      CELERY_RESULT_BACKEND: redis://redis:6379/5
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
      - prod_celery_logs:/app/logs
    depends_on:
      - backend
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prod_frontend
    ports:
      # 仅监听 127.0.0.1，由宿主机 Nginx 反代
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  prod_backend_logs:
  prod_celery_logs:

networks:
  # 加入已存在的 docker network（test 环境创建的），共享 postgres/redis/minio
  shared:
    name: contract-review_contract_review_network
    external: true
