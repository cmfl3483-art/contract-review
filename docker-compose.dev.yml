# Docker Compose 开发环境配置 - 包含 Nginx 反向代理
# Contract Pre-Review System - Development Environment with Nginx

version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: contract_review_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_review
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contract_review_network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: contract_review_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contract_review_network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: contract_review_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API 端口
      - "9001:9001"  # Console 端口
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - contract_review_network

  # Nginx 反向代理 (开发环境)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: contract_review_nginx
    ports:
      - "80:80"  # HTTP 端口
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - contract_review_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 后端服务 (开发环境 - 直接运行,不使用 Docker)
  # 注意: 开发时建议直接在本地运行后端,使用 start-backend.sh
  # 如果需要在 Docker 中运行,取消下面的注释
  backend:
    image: python:3.11-slim
    container_name: contract_review_backend_dev
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/contract_review
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: contract-attachments
      MINIO_SECURE: "false"
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - contract_review_network

  # 前端服务 (开发环境 - Vite 开发服务器)
  # 注意: 开发时建议直接在本地运行前端,使用 start-frontend.sh
  # 如果需要在 Docker 中运行,取消下面的注释
  frontend:
    image: node:18-alpine
    container_name: contract_review_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost/api
      VITE_WS_BASE_URL: ws://localhost/socket.io
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - contract_review_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  contract_review_network:
    driver: bridge
