version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: contract_review_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_review
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contract_review_network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: contract_review_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contract_review_network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: contract_review_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API 端口
      - "9001:9001"  # Console 端口
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - contract_review_network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contract_review_backend
    environment:
      # 数据库配置
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/contract_review
      # Redis 配置
      REDIS_URL: redis://redis:6379/0
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: contract-attachments
      MINIO_SECURE: "false"
      # JWT 配置
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # 钉钉配置 (需要替换为实际值)
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-your-app-key}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-your-app-secret}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-your-corp-id}
      DINGTALK_REDIRECT_URI: https://chenmin.yunumall.com/api/auth/dingtalk/callback
      CORS_ORIGINS: >-
        ["https://chenmin.yunumall.com"]
      # AI 配置 (需要替换为实际值)
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_BASE: ${AI_API_BASE:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY:-your-api-key}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # Celery 配置
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 应用配置
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - contract_review_network
    restart: unless-stopped

  # Celery Worker (异步任务处理)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contract_review_celery_worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      # 数据库配置
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/contract_review
      # Redis 配置
      REDIS_URL: redis://redis:6379/0
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: contract-attachments
      MINIO_SECURE: "false"
      # AI 配置
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_BASE: ${AI_API_BASE:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY:-your-api-key}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # Celery 配置
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # 应用配置
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
      - celery_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - contract_review_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contract_review_frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - contract_review_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  backend_logs:
    driver: local
  celery_logs:
    driver: local

networks:
  contract_review_network:
    driver: bridge
