# 测试环境 Nginx 站点配置
# 部署位置：/etc/nginx/sites-available/chenmin.yunumall.com
# 启用方式：sudo ln -sf /etc/nginx/sites-available/chenmin.yunumall.com /etc/nginx/sites-enabled/
#
# 反代目标：
#   - 前端：127.0.0.1:8080 (contract_review_frontend 容器)
#   - 后端 API：127.0.0.1:8000 (contract_review_backend 容器)
#   - WebSocket：127.0.0.1:8000
#
# SSL：复用已存在的 Let's Encrypt 证书 /etc/letsencrypt/live/chenmin.yunumall.com/
#
# 历史教训：早期版本的此配置缺 /socket.io/ location 段，导致前端无法连
#         WebSocket，浏览器 console 报 "bad response from server"。修复时记得
#         把 socket.io 块放在 location / 之前（nginx 按定义顺序匹配）。

server {
    server_name chenmin.yunumall.com www.chenmin.yunumall.com;

    # Socket.IO WebSocket 代理（必须在 / 之前）
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 75s;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }

    # 前端
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }

    # SSL（已有证书，由 certbot 维护，自动续期）
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chenmin.yunumall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chenmin.yunumall.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS 跳转
server {
    if ($host = chenmin.yunumall.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.chenmin.yunumall.com) {
        return 301 https://chenmin.yunumall.com$request_uri;
    }

    listen 80;
    server_name chenmin.yunumall.com www.chenmin.yunumall.com;
    return 404;
}
